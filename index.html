<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GeoTransformer 地理数据处理箱 —— 浏览器端地理数据处理工具集：格式转换、坐标投影转换、坐标拾取、坐标系检测、数据预览。免费开源，数据不出浏览器。"
    />
    <title>GeoTransformer · 地理数据处理箱</title>
    <!--
      首屏配色：在样式表加载前同步设定 data-theme，避免深色模式下的白屏闪烁。
      ⚠️ 存储键与解析逻辑需与 src/ui/theme.ts 保持一致（该文件负责后续切换）。
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('gt.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232f7d3a' d='M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
